name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-release
            os: windows-latest
            triplet: x64-windows
          - preset: linux-release
            os: ubuntu-22.04
            triplet: x64-linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libxrender-dev libxft-dev libxxf86vm-dev libwayland-dev \
            libxkbcommon-dev ninja-build

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Install Slang Compiler
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            curl -L -o slang.zip "https://github.com/shader-slang/slang/releases/latest/download/slang-windows-x86_64.zip"
            unzip slang.zip
            SLANG_DIR=$(ls -d slang-windows-* | head -n 1)
            echo "$(pwd)/$SLANG_DIR/bin" >> $GITHUB_PATH
          elif [ "$RUNNER_OS" == "Linux" ]; then
            curl -L -o slang.tar.gz "https://github.com/shader-slang/slang/releases/latest/download/slang-linux-x86_64.tar.gz"
            tar -xzf slang.tar.gz
            SLANG_DIR=$(ls -d slang-linux-x86_64-* | head -n 1)
            if [ -z "$SLANG_DIR" ]; then SLANG_DIR=$(ls -d slang-*linux*x86_64* | head -n 1); fi
            echo "$(pwd)/$SLANG_DIR/bin" >> $GITHUB_PATH
          elif [ "$RUNNER_OS" == "macOS" ]; then
            curl -L -o slang.zip "https://github.com/shader-slang/slang/releases/latest/download/slang-macos-x86_64.zip"
            unzip slang.zip
            SLANG_DIR=$(ls -d slang-macos-* | head -n 1)
            echo "$(pwd)/$SLANG_DIR/bin" >> $GITHUB_PATH
          fi
          slangc --version
        shell: bash

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: false
          doNotCache: true

      - name: Cache vcpkg Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/vcpkg
          key: ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build Project
        run: cmake --build --preset ${{ matrix.preset }}
